function hdr(){
  const tot=totalT(),dn=doneT(),pct=Math.round(dn/tot*100);
  return'<div style="text-align:center;padding:16px 0 10px">'
    +'<div style="font-size:20px;font-weight:800;color:#f1f5f9">🎯 365-Day Exam Planner</div>'
    +'<div style="font-size:12px;color:#64748b;margin-top:4px">RBI Grade B + SEBI Grade A &nbsp;·&nbsp; General Stream &nbsp;·&nbsp; Target: Dec 2026 / 2027</div>'
    +'<div style="font-size:11px;color:#475569;margin-top:2px">Also covers SBI PO · IBPS PO · SSC CGL · RBI Assistant · NICL AO &amp; more</div>'
    +'<div style="margin-top:12px;display:inline-block;background:#1e293b;border-radius:10px;padding:10px 20px">'
    +'<div style="font-size:11px;color:#64748b;margin-bottom:5px">Overall Syllabus Progress</div>'
    +'<div style="background:#334155;border-radius:6px;height:10px;width:240px;overflow:hidden;margin:0 auto">'
    +'<div id="pb" style="background:linear-gradient(90deg,#3B82F6,#8B5CF6);border-radius:6px;height:10px;width:'+pct+'%;transition:width .4s"></div>'
    +'</div><div id="pt" style="font-size:12px;color:#94a3b8;margin-top:5px">'+dn+' / '+tot+' topics &nbsp;·&nbsp; '+pct+'% complete</div>'
    +'</div></div>';
}

// TAB NAV
function nav(){
  const tabs=["🗺 Overview","📅 Phase Plan","✅ Syllabus","📊 Mock Strategy","⏰ Daily Schedule"];
  return tabs.map((t,i)=>'<button class="tab-btn" onclick="st('+i+')" style="background:'+(S.tab===i?'#3B82F6':'#1e293b')+';color:'+(S.tab===i?'white':'#94a3b8')+'">'+t+'</button>').join('');
}

// OVERVIEW
function overview(){
  let h='<div class="card"><div style="font-size:14px;font-weight:700;color:#f1f5f9;margin-bottom:12px">📍 365-Day Roadmap at a Glance</div>';
  PHASES.forEach((p,i)=>{
    h+='<div style="display:flex;gap:12px;margin-bottom:'+(i<3?12:0)+'px;align-items:flex-start">'
      +'<div style="width:4px;border-radius:2px;background:'+p.color+';align-self:stretch;min-height:55px;flex-shrink:0"></div>'
      +'<div><div style="display:flex;gap:8px;align-items:center;margin-bottom:2px;flex-wrap:wrap">'
      +'<span style="font-weight:700;color:'+p.color+';font-size:13px">'+p.title+': '+p.sub+'</span>'
      +'<span style="font-size:11px;color:#64748b">'+p.days+'</span></div>'
      +'<div style="font-size:12px;color:#94a3b8;line-height:1.5">'+p.goal+'</div></div></div>';
  });
  h+='</div><div class="card"><div style="font-size:14px;font-weight:700;color:#f1f5f9;margin-bottom:10px">🏆 Exams This Plan Prepares You For</div>';
  EXAMS.forEach((e,i)=>{
    h+='<div style="display:flex;align-items:flex-start;justify-content:space-between;padding:8px 0;'+(i<EXAMS.length-1?'border-bottom:1px solid #1e3a5f;':'')+' gap:10px">'
      +'<div style="flex:1"><div style="font-size:12px;font-weight:600;color:#e2e8f0">'+e.exam+'</div>'
      +'<div style="font-size:11px;color:#64748b;margin-top:2px">'+e.note+'</div></div>'
      +T(e.pct+'%',e.color)+'</div>';
  });
  h+='</div>';
  const res=[{s:"Quant",b:"Arun Sharma (DI + Quant), Sarvesh Kumar Verma, Rajesh Verma"},{s:"Reasoning",b:"MK Pandey, RS Aggarwal, previous year puzzle sheets"},{s:"English",b:"Word Power Made Easy (Norman Lewis), SP Bakshi, daily editorial reading"},{s:"ESI",b:"Ramesh Singh (Indian Economy), Economic Survey, Mrunal Economy notes"},{s:"F&amp;M",b:"M.Y. Khan Financial Services, ICAI material, management NCERT Class 12"},{s:"SEBI",b:"SEBI official website, NSE NCFM modules, NISM Series VIII"},{s:"Current Affairs",b:"The Hindu + PIB daily, GK Today monthly capsule, Insights on India"}];
  h+='<div class="card"><div style="font-size:14px;font-weight:700;color:#f1f5f9;margin-bottom:10px">📚 Recommended Resources</div>';
  res.forEach((r,i)=>{h+='<div style="padding:7px 0;'+(i<res.length-1?'border-bottom:1px solid #1e3a5f;':'')+' display:flex;gap:8px;align-items:baseline;flex-wrap:wrap">'+T(r.s,'#3B82F6')+'<span style="font-size:12px;color:#94a3b8;margin-left:4px">'+r.b+'</span></div>';});
  h+='</div>';
  const tips=["Consistency &gt; Intensity — 8 hours/day every day beats 14-hour occasional marathons","Error log is not optional — it separates rank 1 from rank 1000","Current affairs is a daily habit, not a monthly task — start from Day 1","Mock analysis matters more than mock frequency — 1 well-analysed mock &gt; 3 abandoned ones","Descriptive writing must be practised from Month 2 — last-minute essay cramming fails","SEBI + RBI syllabus overlap is ~70% — treat them as one consolidated preparation"];
  h+='<div class="card" style="border:1px solid #10B98133"><div style="font-size:13px;font-weight:700;color:#10B981;margin-bottom:8px">⚡ Key Success Principles</div>';
  tips.forEach((t,i)=>{h+='<div style="display:flex;gap:8px;padding:5px 0;'+(i<tips.length-1?'border-bottom:1px solid #1e3a5f;':'')+'"><span style="color:#10B981;flex-shrink:0">→</span><span style="font-size:12px;color:#94a3b8;line-height:1.5">'+t+'</span></div>';});
  h+='</div>';
  return h;
}

// PHASES
function phases(){
  const p=PHASES[S.phase];
  let h='<div style="display:flex;gap:6px;margin-bottom:14px">';
  PHASES.forEach((ph,i)=>{
    const a=S.phase===i;
    h+='<button class="phase-btn" onclick="sp('+i+')" style="background:'+(a?ph.color+'22':'#1e293b')+';color:'+(a?ph.color:'#64748b')+';border-color:'+(a?ph.color:'transparent')+'">'+ph.title+'<br><span style="font-weight:400;font-size:10px">'+ph.sub+'</span></button>';
  });
  h+='</div><div class="card" style="border-left:4px solid '+p.color+'">'
    +'<div style="font-weight:700;color:'+p.color+';font-size:14px">'+p.title+': '+p.sub+'</div>'
    +'<div style="font-size:12px;color:#64748b;margin-top:2px">'+p.days+' &nbsp;·&nbsp; '+p.weeks.length+' weeks</div>'
    +'<div style="font-size:12px;color:#cbd5e1;margin-top:6px;line-height:1.5">'+p.goal+'</div></div>';
  h+='<div style="font-size:12px;font-weight:600;color:#64748b;margin-bottom:8px">Weekly Breakdown — tap any week to expand</div>';
  p.weeks.forEach((w,i)=>{
    const exp=S.week===i;
    h+='<div class="week-card" onclick="sw('+i+')">'
      +'<div style="display:flex;justify-content:space-between;align-items:center">'
      +'<div style="display:flex;gap:10px;align-items:center;flex:1">'
      +'<div style="background:'+p.color+'22;color:'+p.color+';border-radius:6px;padding:5px 8px;font-size:11px;font-weight:700;flex-shrink:0">W'+w.w+'</div>'
      +'<div><div style="font-size:13px;font-weight:600;color:#e2e8f0">'+w.focus+'</div>'
      +'<div style="font-size:11px;color:#475569">Days '+w.d+' &nbsp;·&nbsp; '+w.sub+'</div></div></div>'
      +'<span style="color:#475569;font-size:14px">'+(exp?'▲':'▼')+'</span></div>';
    if(exp){h+='<div style="margin-top:12px;border-top:1px solid #334155;padding-top:12px;display:flex;flex-direction:column;gap:8px">'
      +'<div>'+T('Topics','#8B5CF6')+' <span style="font-size:12px;color:#94a3b8;margin-left:6px">'+w.topics+'</span></div>'
      +'<div>'+T('Daily','#10B981')+' <span style="font-size:12px;color:#94a3b8;margin-left:6px">'+w.daily+'</span></div>'
      +'<div>'+T('Target','#F59E0B')+' <span style="font-size:12px;color:#94a3b8;margin-left:6px">'+w.target+'</span></div></div>';}
    h+='</div>';
  });
  return h;
}

// SYLLABUS
function syllabus(){
  let h='<div style="font-size:12px;color:#64748b;margin-bottom:10px">Tap a section to expand. Check topics as you complete them. Progress saves automatically.</div>';
  SK.forEach((sec,si)=>{
    const d=SYL[sec],open=S.sec===sec;
    let dn=0;for(let ti=0;ti<d.topics.length;ti++){if(S.chk[si+'_'+ti])dn++;}
    const pct=Math.round(dn/d.topics.length*100);
    h+='<div class="acc-section"><div class="sec-hdr" onclick="ss('+si+')">'
      +'<span style="font-size:13px;font-weight:700;color:'+d.color+';flex:1">'+sec+'</span>'
      +'<div style="display:flex;gap:8px;align-items:center">'
      +T(dn+'/'+d.topics.length,d.color)
      +'<div style="background:#334155;border-radius:4px;height:6px;width:50px;overflow:hidden;display:inline-block">'
      +'<div style="background:'+d.color+';height:6px;width:'+pct+'%"></div></div>'
      +'<span style="color:#64748b;font-size:13px">'+(open?'▲':'▼')+'</span></div></div>';
    if(open){
      h+='<div style="margin-top:10px;border-top:1px solid #334155;padding-top:10px">';
      d.topics.forEach((tp,ti)=>{
        const ck=S.chk[si+'_'+ti];
        h+='<div class="chk-item" onclick="sc('+si+','+ti+')" style="background:'+(ck?d.color+'14':'transparent')+'">'
          +'<div class="checkbox" style="border:2px solid '+(ck?d.color:'#475569')+';background:'+(ck?d.color:'transparent')+'">'+(ck?'✓':'')+'</div>'
          +'<span style="font-size:12px;color:'+(ck?d.color:'#94a3b8')+';text-decoration:'+(ck?'line-through':'none')+';line-height:1.5">'+tp+'</span></div>';
      });
      h+='</div>';
    }
    h+='</div>';
  });
  return h;
}

// MOCKS
function mocks(){
  let h='';
  MOCKS.forEach(m=>{
    h+='<div class="card" style="border-left:4px solid '+m.color+'">'
      +'<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;flex-wrap:wrap;gap:6px">'
      +'<div style="font-weight:700;color:'+m.color+';font-size:13px">'+m.phase+'</div>'
      +'<div style="display:flex;gap:5px">'+T(m.freq,m.color)+' '+T(m.type,'#64748b')+'</div></div>'
      +'<p style="font-size:12px;color:#94a3b8;line-height:1.7;margin:0 0 8px">'+m.details+'</p>'
      +'<div style="font-size:11px;color:#475569"><span style="color:#64748b;font-weight:600">Practice on: </span>'+m.exams+'</div></div>';
  });
  h+='<div class="card" style="border:1px solid #F59E0B44">'
    +'<div style="font-weight:700;color:#F59E0B;font-size:13px;margin-bottom:8px">📋 Error Log System — Non-Negotiable Rule</div>'
    +'<p style="font-size:12px;color:#94a3b8;line-height:1.7;margin:0 0 10px">After every mock, log each wrong answer with three pieces of information: the topic, the error type, and the correct approach. Review your error log every Sunday. This single discipline separates rankers from average scorers far more than the raw number of mocks taken.</p>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px">';
  [["Concept Gap","Re-study that chapter","#EF4444"],["Silly Mistake","Drill similar Qs more","#F59E0B"],["Time Pressure","Speed drills + shortcuts","#3B82F6"]].forEach(([t,s,c])=>{
    h+='<div style="background:'+c+'11;border:1px solid '+c+'33;border-radius:8px;padding:8px;text-align:center">'
      +'<div style="color:'+c+';font-weight:700;font-size:11px">'+t+'</div>'
      +'<div style="color:#64748b;font-size:10px;margin-top:3px">'+s+'</div></div>';
  });
  h+='</div><div style="font-weight:700;color:#f1f5f9;font-size:13px;margin-bottom:10px">📈 Score Target Progression</div>';
  [{p:"Phase 1 — Sectionals",t:"≥ 60–65%",c:"#3B82F6"},{p:"Phase 2 — Full Phase 1 Mocks",t:"≥ 65–70%",c:"#10B981"},{p:"Phase 3 — Full Phase 1 Mocks",t:"≥ 72–78%",c:"#F59E0B"},{p:"Phase 4 — Grand Tests",t:"≥ 80–85%",c:"#EF4444"}].forEach((x,i)=>{
    h+='<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;'+(i<3?'border-bottom:1px solid #1e3a5f;':'')+'">'
      +'<span style="font-size:12px;color:#94a3b8">'+x.p+'</span>'+T(x.t,x.c)+'</div>';
  });
  h+='</div>';
  return h;
}

// SCHEDULE
function schedule(){
  const tc={personal:"#64748b",ga:"#F59E0B",core:"#EF4444",quant:"#10B981",reasoning:"#8B5CF6",english:"#3B82F6",mock:"#EC4899",revision:"#06B6D4"};
  const tl={personal:"Lifestyle",ga:"Curr. Affairs",core:"Core Subject",quant:"Quant",reasoning:"Reasoning",english:"English",mock:"Mock/PYQ",revision:"Revision"};
  let h='<div class="card" style="border:1px solid #3B82F622"><div style="font-weight:700;color:#f1f5f9;font-size:14px;margin-bottom:4px">⏰ Ideal Daily Schedule (~10.5 Hours Study)</div><div style="font-size:11px;color:#64748b;margin-bottom:12px">Adjust timings to your routine. Keep the subject sequence and total hours consistent.</div>';
  SCHED.forEach((item,i)=>{
    h+='<div style="display:flex;gap:10px;padding:8px 0;'+(i<SCHED.length-1?'border-bottom:1px solid #1e3a5f;':'')+' align-items:flex-start">'
      +'<div style="flex-shrink:0;width:100px;font-size:11px;color:#475569;font-family:monospace;padding-top:2px">'+item.time+'</div>'
      +'<div style="flex:1;font-size:12px;color:#e2e8f0;line-height:1.5">'+item.task+'</div>'
      +'<div style="flex-shrink:0">'+T(tl[item.type],tc[item.type])+'</div></div>';
  });
  h+='</div><div class="card"><div style="font-weight:700;color:#f1f5f9;font-size:13px;margin-bottom:10px">📊 Daily Subject Hour Allocation</div>';
  [{l:"Core Subjects (ESI / F&M / SEBI)",h:"1.5 hrs",c:"#EF4444"},{l:"Quantitative Aptitude",h:"1.5 hrs",c:"#10B981"},{l:"Reasoning Ability",h:"1.25 hrs",c:"#8B5CF6"},{l:"English Language",h:"1.0 hr",c:"#3B82F6"},{l:"Mock Test + Analysis",h:"2.0 hrs",c:"#EC4899"},{l:"Current Affairs + Static GK",h:"2.25 hrs",c:"#F59E0B"},{l:"Revision + Planning",h:"1.0 hr",c:"#06B6D4"}].forEach((x,i)=>{
    h+='<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;'+(i<6?'border-bottom:1px solid #1e3a5f;':'')+'">'
      +'<div style="display:flex;gap:6px;align-items:center"><div style="width:10px;height:10px;border-radius:2px;background:'+x.c+';flex-shrink:0"></div>'
      +'<span style="font-size:12px;color:#94a3b8">'+x.l+'</span></div>'+T(x.h,x.c)+'</div>';
  });
  h+='<div style="margin-top:10px;padding:8px;background:#0f172a;border-radius:8px;text-align:center">'
    +'<span style="font-size:12px;color:#64748b">Total: </span><span style="font-weight:700;color:#f1f5f9;font-size:14px">~10.5 hrs study</span>'
    +'<span style="font-size:12px;color:#64748b"> + meals/breaks</span></div></div>'
    +'<div class="card" style="border:1px solid #10B98133"><div style="font-weight:700;color:#10B981;font-size:13px;margin-bottom:8px">🌿 Weekly Rhythm &amp; Rest Strategy</div>'
    +'<p style="font-size:12px;color:#94a3b8;line-height:1.7"><strong style="color:#e2e8f0">Sunday:</strong> Take your full Phase 1 mock in the morning (from Phase 2 onwards). Spend the afternoon on analysis + weekly revision. Take 2–3 hours fully off in the evening — this is not negotiable. Every 4 weeks, give yourself a half-day of complete rest with zero study. Mental recovery directly improves retention, recall speed, and mock performance. Treat rest as part of your strategy, not a reward.</p></div>';
  return h;
}

// RENDER
function content(){
  switch(S.tab){case 0:return overview();case 1:return phases();case 2:return syllabus();case 3:return mocks();case 4:return schedule();}
}
function upd(){
  document.getElementById('tab-content').innerHTML=content();
  document.querySelectorAll('.tab-btn').forEach((b,i)=>{b.style.background=S.tab===i?'#3B82F6':'#1e293b';b.style.color=S.tab===i?'white':'#94a3b8';});
  const tot=totalT(),dn=doneT(),pct=Math.round(dn/tot*100);
  const pb=document.getElementById('pb'),pt=document.getElementById('pt');
  if(pb)pb.style.width=pct+'%';if(pt)pt.innerHTML=dn+' / '+tot+' topics &nbsp;·&nbsp; '+pct+'% complete';
}
function render(){
  document.getElementById('app').innerHTML=hdr()+'<div class="tab-nav" id="tn">'+nav()+'</div><div id="tab-content">'+content()+'</div>';
}

// HANDLERS
function st(i){S.tab=i;S.week=null;upd();}
function sp(i){S.phase=i;S.week=null;upd();}
function sw(i){S.week=S.week===i?null:i;upd();}
function ss(si){S.sec=S.sec===SK[si]?null:SK[si];upd();}
function sc(si,ti){const k=si+'_'+ti;S.chk[k]=!S.chk[k];save();upd();}

render();
</script>
</body>
</html>
